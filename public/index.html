<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeamsForAI - AI Whiteboard</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="board-panel" aria-label="Whiteboard">
        <div class="board-header">
          <div>
            <h2>Idea Map</h2>
            <p class="muted">Speak ideas into a structured map, then reshape the board directly.</p>
          </div>
        </div>
        <div id="boardStatus" class="status">Board version: 0</div>
        <div id="board" class="board"></div>
      </section>

      <section class="transcript-panel" aria-label="Transcript">
        <h2>Transcript</h2>
        <div id="transcript" class="transcript"></div>
      </section>

      <aside class="command-pane" aria-label="Commands">
        <div class="brand-block">
          <h1>TeamsForAI</h1>
          <p class="muted">Voice-driven whiteboard</p>
        </div>

        <label for="modelInput">Model</label>
        <input id="modelInput" type="text" value="gpt-4o-realtime-preview" />

        <div class="command-stack">
          <button id="connectBtn">Connect</button>
          <button id="disconnectBtn" disabled>Disconnect</button>
          <button id="micBtn" disabled>Mute Mic</button>
          <button id="undoBtn" disabled>Undo</button>
        </div>

        <p id="status" class="status">Status: idle</p>
      </aside>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
